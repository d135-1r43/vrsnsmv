version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait until releases clear pnpm's 24h minimum-release-age supply-chain
    # policy (with margin) before opening update PRs, so Docker builds don't
    # fail on freshly-published versions.
    cooldown:
      default-days: 5
    # TypeScript 7 (native port) drops the JS API that @sveltejs/kit and
    # svelte-check rely on; both still peer-depend on typescript ^6.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"